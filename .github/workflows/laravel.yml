name: Laravel CI

on:
  push:
    branches: ["api-laravel"]
  pull_request:
    branches: ["api-laravel"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: urbasign_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d urbasign_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: urbasign_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: ""

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql
          coverage: none

      - name: Préparer l'environnement Laravel
        run: cp .env.example .env

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la clé de l'application
        run: php artisan key:generate

      - name: Exécuter les tests
        run: php artisan test
