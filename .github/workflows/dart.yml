name: Flutter CI

on:
  push:
    branches: ["mono"]
  pull_request:
    branches: ["mono"]

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-fatal-infos

      - name: Conserver l’APK comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mono/build/app/outputs/flutter-apk/app-release.apk

      - name: Construire l’APP Web
        working-directory: mono
        run: flutter build web

      - name: Conserver l’APP Web comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: mono/build/web
